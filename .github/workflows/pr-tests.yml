name: PR Tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  toolkit-tests:
    name: Toolkit tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check shell syntax
        run: |
          git ls-files -z '*.sh' | xargs -0 -r -n1 bash -n
          for script in tools/sitl tools/hardware tools/tmux_log tools/topic_rates; do
            bash -n "$script"
          done

      - name: Check Python syntax
        run: |
          git ls-files -z '*.py' | xargs -0 -r python3 -m py_compile
          for script in tools/run_sequence tools/px4_analyze tools/px4_compare; do
            python3 -m py_compile "$script"
          done

      - name: Verify installer contracts
        run: python3 -m unittest discover -s tools/tests -p test_installation.py -v

      - name: Install ROS 2 Jazzy
        run: ./setup/install_ros2_jazzy.sh base

      - name: Install hardware build tools
        run: ./setup/install_tools.sh hardware

      - name: Fetch pinned sources
        run: ./setup/fetch_sources.sh hardware

      - name: Build ROS 2 workspace
        run: ./ros2/build.sh hardware

      # Numerical dependencies are needed by analysis regressions, but
      # are intentionally not part of the lean companion installation.
      - name: Install analysis test dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-numpy python3-matplotlib python3-scipy

      - name: Run analysis regressions
        run: python3 -m unittest discover -s analysis/tests -p 'test_*.py' -v

      - name: Run hardware ROS tests
        run: ./ros2/test.sh hardware
