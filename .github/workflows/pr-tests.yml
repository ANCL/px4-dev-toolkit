name: PR Tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-24.04
    outputs:
      docs: ${{ steps.paths.outputs.docs }}
      ros2: ${{ steps.paths.outputs.ros2 }}
    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select required checks
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/pr-paths"
          docs=false
          ros2=false
          while IFS= read -r -d '' path; do
            case "$path" in
              README.md|mkdocs.yml|docs/*|.github/workflows/docs.yml|.github/workflows/pr-tests.yml)
                docs=true
                ;;
              *)
                ros2=true
                ;;
            esac
          done < "$RUNNER_TEMP/pr-paths"
          printf 'docs=%s\nros2=%s\n' "$docs" "$ros2" >> "$GITHUB_OUTPUT"

  docs:
    name: Docs build
    needs: classify
    if: needs.classify.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install documentation dependencies
        run: python -m pip install mkdocs-material==9.7.7

      - name: Build documentation
        run: python -m mkdocs build --strict

  ros2-tests:
    name: ROS 2 tests
    needs: classify
    if: needs.classify.outputs.ros2 == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check shell syntax
        run: |
          git ls-files -z '*.sh' | xargs -0 -r -n1 bash -n
          for script in tools/sitl tools/hardware tools/tmux_log tools/topic_rates; do
            bash -n "$script"
          done

      - name: Check Python syntax
        run: |
          git ls-files -z '*.py' | xargs -0 -r python3 -m py_compile
          for script in tools/run_sequence tools/px4_analyze tools/px4_compare; do
            python3 -m py_compile "$script"
          done

      - name: Verify installer contracts
        run: python3 -m unittest discover -s tools/tests -p test_installation.py -v

      - name: Install ROS 2 Jazzy
        run: ./setup/install_ros2_jazzy.sh base

      - name: Install hardware build tools
        run: ./setup/install_tools.sh hardware

      - name: Fetch pinned sources
        run: ./setup/fetch_sources.sh hardware

      - name: Build ROS 2 workspace
        run: ./ros2/build.sh hardware

      # Numerical dependencies are needed by analysis regressions, but
      # are intentionally not part of the lean companion installation.
      - name: Install analysis test dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-numpy python3-matplotlib python3-scipy

      - name: Run analysis regressions
        run: python3 -m unittest discover -s analysis/tests -p 'test_*.py' -v

      - name: Run hardware ROS tests
        run: ./ros2/test.sh hardware

  toolkit-tests:
    name: Toolkit tests
    needs: [classify, docs, ros2-tests]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Verify required checks
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          DOCS_REQUIRED: ${{ needs.classify.outputs.docs }}
          DOCS_RESULT: ${{ needs.docs.result }}
          ROS_REQUIRED: ${{ needs.classify.outputs.ros2 }}
          ROS_RESULT: ${{ needs.ros2-tests.result }}
        run: |
          test "$CLASSIFY_RESULT" = success
          if [ "$DOCS_REQUIRED" = true ]; then
            test "$DOCS_RESULT" = success
          fi
          if [ "$ROS_REQUIRED" = true ]; then
            test "$ROS_RESULT" = success
          fi
          if [ "$DOCS_REQUIRED" != true ] && [ "$ROS_REQUIRED" != true ]; then
            echo "No changed paths were classified." >&2
            exit 1
          fi
