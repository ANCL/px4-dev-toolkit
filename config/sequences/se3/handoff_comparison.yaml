name: se3_handoff_comparison
profile: se3
recording_output_argument: recording_output
settle_seconds: 3.0

steps:
  - name: acceleration
    package: offboard_controllers
    launch: se3.launch.py
    arguments:
      vehicle: gz_f450
      trajectory: full_excitation
      handoff: acceleration
      publish_diagnostics: true
      record: true

  - name: attitude
    package: offboard_controllers
    launch: se3.launch.py
    arguments:
      vehicle: gz_f450
      trajectory: full_excitation
      handoff: attitude
      publish_diagnostics: true
      record: true

  - name: attitude_rate
    package: offboard_controllers
    launch: se3.launch.py
    arguments:
      vehicle: gz_f450
      trajectory: full_excitation
      handoff: attitude_rate
      publish_diagnostics: true
      record: true

  - name: thrust_and_torque_geometric_normalized
    package: offboard_controllers
    launch: se3.launch.py
    arguments:
      vehicle: gz_f450
      trajectory: full_excitation
      handoff: thrust_and_torque
      direct_controller: geometric_normalized
      publish_diagnostics: true
      record: true

  - name: thrust_and_torque_px4_rate
    package: offboard_controllers
    launch: se3.launch.py
    arguments:
      vehicle: gz_f450
      trajectory: full_excitation
      handoff: thrust_and_torque
      direct_controller: px4_rate
      publish_diagnostics: true
      record: true

  - name: thrust_and_torque_geometric_physical
    package: offboard_controllers
    launch: se3.launch.py
    arguments:
      vehicle: gz_f450
      trajectory: full_excitation
      handoff: thrust_and_torque
      direct_controller: geometric_physical
      publish_diagnostics: true
      record: true
