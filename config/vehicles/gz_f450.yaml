# Manually curated vehicle data for the PX4 Gazebo F450.
#
# Values are taken from the exact pinned PX4 source listed below.
# This file is intentionally not generated automatically.

vehicle:
  name: gz_f450
  type: quadrotor

source:
  px4_commit: f5083ca2c5b919350880e8667e636ef70715db17
  airframe: ROMFS/px4fmu_common/init.d-posix/airframes/4022_gz_f450
  gazebo_model: Tools/simulation/gz/models/f450/model.sdf

plant:
  # Whole-model values reported by:
  #   gz sdf --inertial-stats model.sdf
  frame: FLU

  mass_kg: 2.0736

  center_of_mass_m:
    x: 0.0
    y: 0.0
    z: 0.000279514

  inertia_kg_m2:
    xx: 0.021997
    xy: 1.0842e-19
    xz: 3.38813e-21
    yy: 0.0221599
    yz: 3.38813e-21
    zz: 0.0433006

# Physical propulsion model shared by simulation and controller deployment.
#
# For the pinned F450 Gazebo/PX4 model:
#
#   T = 1.2e-5 * omega^2
#   omega = 150 + 850 * u
#   THR_MDL_FAC = 0
#
# which gives the exact normalized-control thrust curve:
#
#   T(u) = 0.27 + 3.06 u + 8.67 u^2  [N]
#
# The controller consumes this physical relationship rather than any
# Gazebo-specific rotor-velocity or ESC representation.
propulsion:
  frame: FLU
  rotor_count: 4
  moment_ratio_m: 0.0137

  actuator_thrust:
    control_min: 0.0
    control_max: 1.0
    polynomial_n: [0.27, 3.06, 8.67]

  rotors:
    - index: 0
      position_m: [0.1626345596714, -0.1626345596714, 0.0115]
      direction: ccw

    - index: 1
      position_m: [-0.1626345596714, 0.1626345596714, 0.0115]
      direction: ccw

    - index: 2
      position_m: [0.1626345596714, 0.1626345596714, 0.0115]
      direction: cw

    - index: 3
      position_m: [-0.1626345596714, -0.1626345596714, 0.0115]
      direction: cw

px4_allocator:
  frame: FRD
  airframe_type: 0
  rotor_count: 4
  hover_thrust: 0.60

  # CA_ROTOR*_CT is not overridden by the F450 airframe, so the pinned PX4
  # control_allocator/module.yaml default of 6.5 is active for all four rotors.
  thrust_coefficient: 6.5

  rotors:
    - index: 0
      name: front_right
      position_m: [0.159, 0.159]
      km: 0.014

    - index: 1
      name: back_left
      position_m: [-0.159, -0.159]
      km: 0.014

    - index: 2
      name: front_left
      position_m: [0.159, -0.159]
      km: -0.014

    - index: 3
      name: back_right
      position_m: [-0.159, 0.159]
      km: -0.014
