<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 540" role="img" aria-labelledby="title desc"><title id="title">NED and FRD frames</title><desc id="desc">World and body frames stacked for narrow screens. Both have down-positive Z. Gravity is world down; rotor thrust is opposite body down. Rotation R maps body to world.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 7 3 0 6" fill="none" stroke="#74899a"/></marker></defs><g fill="none" stroke="#74899a" stroke-width="2.5" marker-end="url(#a)"><path d="M110 100H285 M110 100 40 60 M110 100V205"/><path d="M110 370H285 M110 370 40 330 M110 370V475 M225 405V290"/></g><g fill="#74899a" font-family="system-ui,sans-serif" font-size="17"><text x="30" y="30">World: NED</text><text x="170" y="90">North x</text><text x="15" y="52">East y</text><text x="120" y="225">Down z, gravity</text><text x="30" y="275">Body: FRD</text><text x="170" y="360">Forward x</text><text x="15" y="322">Right y</text><text x="120" y="495">Body down z</text><text x="233" y="309">Thrust −z</text><text x="30" y="530">R maps body coordinates to world.</text></g></svg>
