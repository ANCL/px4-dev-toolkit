<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="title desc">
<title id="title">World NED and body FRD conventions</title><desc id="desc">Down-positive axes in world and body frames. Gravity points down in NED; thrust points opposite body down. R maps body vectors to world coordinates.</desc>
<style>
:root { --line:#41676d; --faint:#a4bfba; --accent:#006b62; --text:#213237; }
@media (prefers-color-scheme:dark) { :root { --line:#accac5; --faint:#527572; --accent:#81d5bc; --text:#e1e9e7; } }
.axis { fill:none; stroke:var(--line); stroke-width:2.5; }
.force { fill:none; stroke:var(--accent); stroke-width:3; }
.label { fill:var(--text); font-family:"Segoe UI",sans-serif; font-size:20px; }
</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 7 3 0 6" fill="none" stroke="var(--line)"/></marker><marker id="force" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 7 3 0 6" fill="none" stroke="var(--accent)"/></marker></defs>
<g class="axis" marker-end="url(#arrow)"><path d="M120 140H260 M120 140 55 90 M120 140V260"/><path d="M435 140H575 M435 140 370 90 M435 140V260"/></g>
<path class="force" marker-end="url(#force)" d="M635 215V75"/>
<g class="label"><text x="40" y="40" font-weight="600">World · NED</text><text x="355" y="40" font-weight="600">Body · FRD</text><text x="155" y="128">North x</text><text x="24" y="78">East y</text><text x="135" y="284">Down z, gravity</text><text x="463" y="128">Forward x</text><text x="340" y="78">Right y</text><text x="450" y="284">Body down z</text><text x="592" y="58">Thrust −z</text><text x="292" y="209" font-size="18">R: body</text><text x="292" y="234" font-size="18">→ world</text></g>
</svg>
