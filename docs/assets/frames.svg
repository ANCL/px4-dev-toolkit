<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 300" role="img" aria-labelledby="title desc">
<title id="title">World NED and body FRD conventions</title><desc id="desc">North and forward point right, East and right point diagonally back, and Down points down. Gravity is world down; thrust is opposite body down. Rotation R maps body coordinates to world coordinates.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 7 3 0 6" fill="none" stroke="#74899a"/></marker></defs>
<g fill="none" stroke="#74899a" stroke-width="2.5" marker-end="url(#arrow)"><path d="M130 125H265 M130 125 55 75 M130 125V250"/><path d="M470 125H605 M470 125 395 75 M470 125V250"/><path d="M530 165V40"/></g>
<g fill="#74899a" font-family="system-ui,sans-serif" font-size="17"><text x="55" y="32">World: NED</text><text x="395" y="32">Body: FRD</text><text x="175" y="115">North x</text><text x="28" y="65">East y</text><text x="138" y="270">Down z, gravity</text><text x="515" y="115">Forward x</text><text x="362" y="65">Right y</text><text x="478" y="270">Body down z</text><text x="540" y="60">Thrust −z</text><text x="310" y="185">R: body</text><text x="310" y="210">to world</text></g></svg>
