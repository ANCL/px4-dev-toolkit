site_name: PX4 Development Toolkit
site_description: Reproducible PX4 and ROS 2 development from simulation to physical flight.
site_url: https://ancl.github.io/px4-dev-toolkit/

repo_url: https://github.com/ANCL/px4-dev-toolkit
repo_name: ANCL/px4-dev-toolkit

theme:
  name: material
  language: en

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md

  - Installation:
      - Docker: installation/docker.md
      - Native: installation/native.md

  - Environments:
      - SITL: environments/sitl.md
      - Hardware: environments/hardware.md

  - Controllers:
      - Overview: controllers/overview.md
      - SE(3): controllers/se3.md
      - Trajectories: controllers/trajectories.md

  - Workflows:
      - Recording: workflows/recording.md
      - Sequences: workflows/sequences.md

  - Analysis:
      - Single-run analysis: analysis/analysis.md
      - Comparison: analysis/comparison.md

  - Reference:
      - Architecture: reference/architecture.md
      - Configuration: reference/configuration.md
      - Extending: reference/extending.md
      - Troubleshooting: reference/troubleshooting.md
