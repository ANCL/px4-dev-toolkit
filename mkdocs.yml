site_name: PX4 Development Toolkit
site_description: PX4 and ROS 2 flight-control examples, SE(3) mathematics, simulation, recording, and analysis.
site_url: https://ancl.github.io/px4-dev-toolkit/
repo_url: https://github.com/ANCL/px4-dev-toolkit
repo_name: ANCL/px4-dev-toolkit

theme:
  name: material
  language: en
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github
validation:
  links:
    anchors: warn
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
nav:
  - Home: index.md
  - Get started:
      - Install: installation/index.md
      - SITL:
          - Ubuntu: installation/native.md
          - Docker: installation/docker.md
      - Companion: installation/companion.md
      - First simulation: getting-started/first-simulation.md
  - Using the toolkit:
      - SITL: environments/sitl.md
      - Companion: environments/hardware.md
      - Onboard: operations/onboard.md
      - Offboard: operations/offboard.md
      - Tools: operations/tools.md
  - Controllers:
      - Overview: controllers/overview.md
      - PX4 reference:
          - Position mode: controllers/position-mode.md
          - Staging: controllers/offboard-staging.md
      - Offboard (ROS 2):
          - Position: controllers/offboard-position.md
          - SE3:
              - Overview: controllers/se3.md
              - Acceleration: controllers/se3/acceleration.md
              - Attitude: controllers/se3/attitude.md
              - Body rate: controllers/se3/attitude-rate.md
              - Normalized torque: controllers/se3/geometric-normalized.md
              - Physical torque: controllers/se3/geometric-physical.md
              - PX4 rate PID: controllers/se3/px4-rate.md
      - Onboard (PX4):
          - SE3: controllers/onboard-se3.md
  - Mathematics:
      - Geometric control: mathematics/geometric-control.md
  - Experiments:
      - Trajectories: controllers/trajectories.md
      - SITL example: experiments/complete-example.md
      - Recording: workflows/recording.md
      - Onboard logs: workflows/onboard-logging.md
      - Sequences: workflows/sequences.md
      - Analysis: analysis/analysis.md
      - Comparison: analysis/comparison.md
      - Data formats: workflows/common-analysis.md
  - Extending:
      - Overview: reference/extending.md
      - Vehicles: reference/adding-a-vehicle.md
      - Controllers: reference/developing-a-controller.md
  - Reference:
      - Architecture: reference/architecture.md
      - Configuration: reference/configuration.md
      - Troubleshooting: reference/troubleshooting.md
