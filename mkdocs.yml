site_name: PX4 Development Toolkit
site_description: PX4 and ROS 2 flight-control examples, SE(3) mathematics, simulation, recording, and analysis.
site_url: https://ancl.github.io/px4-dev-toolkit/
repo_url: https://github.com/ANCL/px4-dev-toolkit
repo_name: ANCL/px4-dev-toolkit

theme:
  name: material
  language: en
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github
validation:
  links:
    anchors: warn
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
nav:
  - Home: index.md
  - Getting started:
      - Installation options: installation/index.md
      - SITL installation:
          - Native Ubuntu: installation/native.md
          - Docker: installation/docker.md
      - Companion computer: installation/companion.md
      - First simulation: getting-started/first-simulation.md
  - Running the toolkit:
      - SITL: environments/sitl.md
      - Physical hardware: environments/hardware.md
      - Position mode and switching to Offboard: controllers/position-mode.md
      - Offboard position control: controllers/offboard-position.md
  - Controllers:
      - Overview: controllers/overview.md
      - SE(3) control:
          - Introduction: controllers/se3.md
          - Mathematical foundations: controllers/se3/foundations.md
          - Acceleration: controllers/se3/acceleration.md
          - Attitude: controllers/se3/attitude.md
          - Attitude rate: controllers/se3/attitude-rate.md
          - Geometric normalized torque: controllers/se3/geometric-normalized.md
          - PX4 rate controller: controllers/se3/px4-rate.md
          - Geometric physical moment: controllers/se3/geometric-physical.md
      - Trajectories: controllers/trajectories.md
  - Experiments and analysis:
      - Complete SITL experiment: experiments/complete-example.md
      - Recording: workflows/recording.md
      - Running a series of experiments: workflows/sequences.md
      - Analyzing one run: analysis/analysis.md
      - Comparing SE(3) controllers: analysis/comparison.md
  - Extending the toolkit:
      - Adding to the toolkit: reference/extending.md
      - Adding a vehicle: reference/adding-a-vehicle.md
      - Developing a controller: reference/developing-a-controller.md
  - Technical reference:
      - Software structure: reference/architecture.md
      - Configuration files: reference/configuration.md
      - Troubleshooting: reference/troubleshooting.md
