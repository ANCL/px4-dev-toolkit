site_name: PX4 Development Toolkit
site_description: PX4 and ROS 2 flight-control examples, SE(3) mathematics, simulation, recording, and analysis.
site_url: https://ancl.github.io/px4-dev-toolkit/
repo_url: https://github.com/ANCL/px4-dev-toolkit
repo_name: ANCL/px4-dev-toolkit

theme:
  name: material
  language: en
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github
validation:
  links:
    anchors: warn
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
nav:
  - Home: index.md
  - Get started:
      - Install: get-started/index.md
      - SITL:
          - Ubuntu: get-started/sitl/ubuntu.md
          - Docker: get-started/sitl/docker.md
      - Companion: get-started/companion.md
      - First simulation: get-started/first-simulation.md
  - Operations:
      - Overview: operations/index.md
      - SITL: operations/sitl.md
      - Companion: operations/companion.md
      - Onboard: operations/onboard.md
      - Offboard: operations/offboard.md
      - Tools: operations/tools.md
  - Controllers:
      - Overview: controllers/index.md
      - PX4 reference:
          - Position mode: controllers/px4-reference/position-mode.md
          - Staging: controllers/px4-reference/staging.md
      - Offboard (ROS 2):
          - Position: controllers/offboard/position.md
          - SE3:
              - Overview: controllers/offboard/se3/index.md
              - Acceleration: controllers/offboard/se3/acceleration.md
              - Attitude: controllers/offboard/se3/attitude.md
              - Body rate: controllers/offboard/se3/attitude-rate.md
              - Normalized torque: controllers/offboard/se3/geometric-normalized.md
              - Physical torque: controllers/offboard/se3/geometric-physical.md
              - PX4 rate PID: controllers/offboard/se3/px4-rate.md
      - Onboard (PX4):
          - SE3: controllers/onboard/se3.md
  - Mathematics:
      - Geometric control: mathematics/index.md
  - Experiments:
      - Overview: experiments/index.md
      - Trajectories: experiments/trajectories.md
      - SITL example: experiments/sitl-example.md
      - Recording: experiments/recording.md
      - Onboard logs: experiments/onboard-logs.md
      - Sequences: experiments/sequences.md
      - Analysis: experiments/analysis.md
      - Comparison: experiments/comparison.md
      - Data formats: experiments/data-formats.md
  - Extending:
      - Overview: extending/index.md
      - Vehicles: extending/vehicles.md
      - Controllers: extending/controllers.md
  - Reference:
      - Overview: reference/index.md
      - Architecture: reference/architecture.md
      - Configuration: reference/configuration.md
      - Troubleshooting: reference/troubleshooting.md
