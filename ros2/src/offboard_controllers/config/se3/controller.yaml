se3:
  ros__parameters:
    # Geometric SE(3) translational gains normalized by vehicle mass:
    #   kx = mass * kx_over_mass
    #   kv = mass * kv_over_mass
    #
    # kx_over_mass has units [1/s^2]; kv_over_mass has units [1/s].
    kx_over_mass: 16.0
    kv_over_mass: 5.6

    # Cascaded attitude-error -> FRD body-rate gain [1/s], used by the
    # attitude_rate handoff and the outer attitude law of px4_rate.
    attitude_gain: [6.5, 6.5, 2.8]

    # PX4 multicopter rate-controller parameters reproduced from
    # f5083ca2c5b919350880e8667e636ef70715db17. These are controller tuning
    # values, not physical vehicle properties.
    px4_rate_p: [0.15, 0.15, 0.20]
    px4_rate_i: [0.20, 0.20, 0.10]
    px4_rate_d: [0.003, 0.003, 0.0]
    px4_rate_ff: [0.0, 0.0, 0.0]
    px4_rate_k: [1.0, 1.0, 1.0]
    px4_rate_integrator_limit: [0.30, 0.30, 0.30]
    px4_rate_yaw_torque_cutoff_hz: 2.0
    px4_rate_battery_scale_enabled: false

    # Physical geometric rotational gains:
    #
    #   M = -K_R e_R - K_Omega e_Omega
    #       + Omega x J Omega + J alpha_ff
    #
    # K_R is in N m and K_Omega in N m s. These are controller tuning values,
    # not vehicle properties.
    geometric_physical_k_r: [5.955179, 5.955179, 0.407475]
    geometric_physical_k_omega: [0.916181, 0.916181, 0.145527]

    # Geometric-normalized gains produce PX4-normalized torque directly.
    # K_R^n = attitude_gain * K_Omega^n component-wise.
    normalized_attitude_gain: [0.975, 0.975, 0.56]

    # Angular-velocity error [rad/s] -> normalized torque.
    normalized_angular_velocity_gain: [0.15, 0.15, 0.20]

    # Desired angular acceleration [rad/s^2] -> normalized torque
    # feed-forward; this is not PX4 rate-controller D feedback.
    normalized_angular_acceleration_gain: [0.003, 0.003, 0.0]

    # Controller update rate.
    control_rate_hz: 100.0

    # Offboard lifecycle timing [s].
    warmup_duration_s: 1.5
    offboard_retry_interval_s: 1.0
